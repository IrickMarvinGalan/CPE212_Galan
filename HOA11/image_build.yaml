---
- name: Building the Docker Image
  hosts: webservers
  become: true
  vars:
    image_name: web_db_image
    image_tag: 1.0
    build_dir: .

  roles:
    - role: DockerInstall
      tags: install

  tasks:
    - name: Build the image from the Dockerfile​
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        build:
          path: "{{ build_dir }}"
          dockerfile: Dockerfile
          pull: false #Rebuild only when the copied files changed (keeps reruns idempotent).​
        state: present
      register: image_build
      retries: 5
      delay: 5
      until: image_build is succeeded
      when: inventory_hostname == "control-node"

    - name: Also tag the image as latest
      community.docker.docker_image_tag:
        name: "{{ image_name }}:{{ image_tag }}"
        repository:
          - "{{ image_name }}:latest"
