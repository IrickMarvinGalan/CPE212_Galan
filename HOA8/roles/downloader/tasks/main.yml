---

- name: Create download destination
  become: false
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/NagiosDownloads"
    state: directory

- name: Download nagios
  become: false
  ansible.builtin.get_url:
    url: http://prdownloads.sourceforge.net/sourceforge/nagios/nagios-4.2.1.tar.gz
    dest: "{{ ansible_env.HOME }}/NagiosDownloads/nagios-4.2.1.tar.gz"

- name: Download nagios plugins
  become: false
  ansible.builtin.get_url:
    url: https://github.com/nagios-plugins/nagios-plugins/archive/refs/tags/release-2.1.3.tar.gz
    dest: "{{ ansible_env.HOME }}/NagiosDownloads/nagios-plugins-2.1.3.tar.gz"

- name: Decompress downloaded files
  become: false
  ansible.builtin.unarchive:
    src: "{{ item }}"
    dest: "{{ ansible_env.HOME }}/NagiosDownloads"
    remote_src: true
  loop:
    - "{{ ansible_env.HOME }}/NagiosDownloads/nagios-4.2.1.tar.gz"
    - "{{ ansible_env.HOME }}/NagiosDownloads/nagios-plugins-2.1.3.tar.gz"
