version: '3'
services:
  mongodb:
    image: mongo:7
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    networks:
      - mongo-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-express:
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=password
    networks:
      - mongo-net
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure

  app:
    image: webapp:v0
    ports:
      - 3000:3000
    networks:
      - mongo-net
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure

networks:
  mongo-net:
    name: mongo-net
